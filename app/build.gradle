plugins { id 'com.android.application' }
android {
    namespace 'io.github.mmarkimark.llartv'
    compileSdk 33
    buildToolsVersion "36.0.0"
    defaultConfig {
        applicationId 'io.github.mmarkimark.llartv'
        minSdk 28          // TV runs Android 9
        targetSdk 33
        versionCode 9
        versionName '1.8'
    }
    // Measurement candidate for #104: the debug build stays the published variant (same certificate, debuggable,
    // installed in place), so R8 is the only difference from the v1.8 baseline. Not a release decision.
    buildTypes {
        debug {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'   // real org.json for JVM tests (android.jar only has stubs)
}
